<style>
:root{--ink:#241c2b;--cream:#fff6ec;--pink:#ff86b0;--blue:#79cdf4;--muted:#cbbfcf;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:#1d1724;color:var(--cream);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
form{background:rgba(36,27,44,.92);border-radius:22px;padding:26px;width:min(380px,100%);box-sizing:border-box;display:grid;gap:14px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
img{width:96px;height:96px;border-radius:22px;margin:0 auto}
h1{margin:0;font-size:26px}h1 .c{color:var(--pink)}h1 .s{color:var(--blue)}
p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.15);background:#2a2233;color:var(--cream);text-align:center}
input[type=password]:focus{outline:none;border-color:var(--blue)}
label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--muted)}
button{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:999px;padding:12px;background:var(--pink);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
#err{color:#ff9a8a;min-height:1.2em}
</style></head><body>

const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));
  const html=new TextDecoder().decode(pt); document.open(); document.write(html); document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},base,256));
}
const KEY='cs-key-'+D.s;
(async()=>{ try{ const k=localStorage.getItem(KEY); if(k){ await open(u8(k)); return; } }catch(e){ try{ localStorage.removeItem(KEY); }catch(_){} } document.getElementById('pw').focus(); })();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault(); const err=document.getElementById('err'), btn=document.getElementById('go'); err.textContent=''; btn.textContent='Unlocking...'; btn.disabled=true;
  try{ const raw=await derive(document.getElementById('pw').value.trim());
    await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(k=>crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},k,u8(D.c)));
    if(document.getElementById('rem').checked){ try{ localStorage.setItem(KEY,btoa(String.fromCharCode(...raw))); }catch(_){} }
    await open(raw);
  }catch(x){ err.textContent='That password didn’t work. Try again.'; btn.textContent='Unlock'; btn.disabled=false; }
});
